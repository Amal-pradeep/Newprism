name: COMIT one-time release check

on:
  push:
    branches:
      - feature/comit-aneesh-creative-ops

jobs:
  verify-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: comit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run regression
      - run: npm run build
      - run: npm run cf:build
      - run: npm audit --omit=dev --audit-level=high
