name: Cloudflare deploy credential check

on:
  push:
    branches:
      - feature/comit-aneesh-creative-ops

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "cloudflare_api_token=configured"; else echo "cloudflare_api_token=missing"; fi
          if [ -n "$CF_ACCOUNT" ]; then echo "cloudflare_account_id=configured"; else echo "cloudflare_account_id=missing"; fi
