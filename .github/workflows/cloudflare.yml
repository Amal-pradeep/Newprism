name: COMIT Cloudflare validation

on:
  push:
    branches: [main]
    paths:
      - "comit/**"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "comit/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate COMIT for Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: comit/package-lock.json
      - name: Install dependencies
        working-directory: comit
        run: npm ci
      - name: Verify application
        working-directory: comit
        run: npm run verify
      - name: Build Cloudflare Worker
        working-directory: comit
        run: npm run cf:build
