name: COMIT Cloudflare validation

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - "comit/**"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "comit/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate COMIT for Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: comit/package-lock.json
      - name: Install dependencies
        working-directory: comit
        run: npm ci
      - name: Typecheck
        working-directory: comit
        run: npm run typecheck
      - name: Regression guard
        working-directory: comit
        run: npm run regression
      - name: Build Cloudflare Worker
        working-directory: comit
        run: npm run cf:build