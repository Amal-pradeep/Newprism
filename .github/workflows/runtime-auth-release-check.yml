name: COMIT runtime auth release check

on:
  push:
    branches:
      - hotfix/comit-cloudflare-runtime-auth

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: comit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run regression
      - run: npm run build
      - run: npm run cf:build
      - run: npm audit --omit=dev --audit-level=high
