name: COMIT CI

on:
  push:
    paths:
      - "comit/**"
  pull_request:
    paths:
      - "comit/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: comit/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run cf:build
