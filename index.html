<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Prism Orbit</title><style>
:root{--b:#070a0f;--p:#111722e8;--l:#ffffff14;--t:#f5f7fb;--m:#93a0b2;--g:#63e6a2;--v:#9b8cff;--a:#ffd166;--r:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 450px at 85% 0,#214734,transparent 60%),radial-gradient(700px 500px at 0 25%,#241d40,transparent 60%),var(--b);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#07090dec;border-right:1px solid var(--l);padding:18px 13px;z-index:5}.logo{font-weight:900;letter-spacing:.14em;padding:9px}.logo small{display:block;color:var(--m);letter-spacing:0;margin-top:5px;font-weight:500}.nav{display:grid;gap:4px;margin-top:20px}.nav button,.bottom button{border:0;background:none;color:var(--m);padding:10px;border-radius:12px;text-align:left}.nav button.active,.nav button:hover,.bottom button.active{background:#63e6a212;color:var(--t)}.main{margin-left:240px;padding:20px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ey{color:var(--g);font-size:10px;text-transform:uppercase;letter-spacing:.16em}.title{font-size:27px;font-weight:800;margin:4px 0}.muted{color:var(--m)}.actions{display:flex;gap:7px}.btn,.input,.select,.area{border:1px solid var(--l);background:#ffffff07;color:var(--t);border-radius:12px;padding:10px 12px}.btn:hover{background:#ffffff0d}.primary{background:linear-gradient(135deg,#7af0b0,#3fc982);color:#06120b;border:0;font-weight:800}.ai{background:linear-gradient(135deg,#a99cff,#6255cf);border:0;font-weight:800}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{border:1px solid var(--l);background:linear-gradient(145deg,var(--p),#0b1018e8);border-radius:19px;padding:16px;box-shadow:0 22px 70px #0005}.hero{min-height:280px;position:relative;overflow:hidden}.hero h2{font-size:34px;max-width:650px;margin:13px 0}.hero p{max-width:690px;color:var(--m);line-height:1.6}.orb{position:absolute;right:10%;top:55px;width:145px;height:145px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#63e6a2 17%,#174d35 50%,#070a0f 72%);box-shadow:0 0 110px #63e6a233}.command{display:flex;gap:7px;max-width:700px}.command input{flex:1}.metric{font-size:28px;font-weight:900;margin:6px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--l);border-radius:13px;padding:11px;margin-top:8px}.tag{font-size:10px;padding:4px 8px;border-radius:99px;background:#63e6a212;color:var(--g)}.amber{color:var(--a);background:#ffd16612}.red{color:var(--r);background:#ff718512}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--m)}.form .input,.form .select,.form .area{width:100%}.area{min-height:110px;resize:vertical}.result{white-space:pre-wrap;line-height:1.55;background:#05080d;border:1px solid var(--l);border-radius:14px;padding:14px;margin-top:12px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.col{min-height:210px;background:#ffffff04;border:1px solid var(--l);border-radius:14px;padding:9px}.task{padding:10px;border:1px solid var(--l);border-radius:12px;background:#0c1119;margin-top:7px}.bottom{display:none}.toast{position:fixed;right:15px;bottom:15px;padding:12px 15px;background:#121a24;border:1px solid var(--l);border-radius:12px;display:none;z-index:50}.toast.on{display:block}@media(max-width:850px){.side{display:none}.main{margin:0;padding:12px 11px 82px}.g2,.g3,.g4{grid-template-columns:1fr}.hero h2{font-size:28px}.orb{opacity:.35;right:-30px}.search{display:none}.kanban{grid-template-columns:1fr 1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#080b0fee;border-top:1px solid var(--l);z-index:20;padding:5px}.bottom button{text-align:center;font-size:9px;padding:7px}.bottom b{display:block;font-size:16px}}</style></head><body>
<aside class="side"><div class="logo">PRISM ORBIT<small>Prism of Stories · Agency OS</small></div><nav id="nav" class="nav"></nav></aside>
<main class="main"><header class="top"><div><div class="ey">Prism of Stories</div><div id="title" class="title">Command Center</div><div class="muted">Agency intelligence · Amal sir</div></div><div class="actions"><input id="search" class="input search" placeholder="Search"><button class="btn" onclick="show('notifications')">🔔</button><button class="btn ai" onclick="show('ai')">✦ AI</button></div></header><div id="pages"></div></main><nav id="bottom" class="bottom"></nav><div id="toast" class="toast"></div>
<script>
const K='prism_orbit_v6',N=[['home','⌂','Command Center'],['research','⌕','Research Intelligence'],['marketing','◎','Marketing AI'],['sales','↗','Sales AI'],['clients','◇','Clients'],['projects','▣','Projects'],['tasks','✓','Tasks'],['team','◉','Team'],['ai','✦','Prism AI'],['reports','▤','Reports'],['notifications','🔔','Notifications'],['settings','⚙','Settings']];
let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[['Review Nostaza campaign','High','Today'],['Prepare Dubai hospitality prospects','High','Open'],['Aneesh — restaurant reel','Creative','Open'],['Satheesh — Lunes AI automation','Technical','Open']],leads:[],studies:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S)),toast=x=>{let e=document.getElementById('toast');e.textContent=x;e.className='toast on';setTimeout(()=>e.className='toast',1800)};
function show(k){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+k).classList.add('active');document.getElementById('title').textContent=(N.find(x=>x[0]==k)||['','',k])[2];document.querySelectorAll('[data-k]').forEach(e=>e.classList.toggle('active',e.dataset.k==k));scrollTo(0,0)}
function card(t,b){return '<div class="card"><b>'+t+'</b>'+b+'</div>'}
function home(){return '<div class="card hero"><div class="ey">Agency operating system</div><h2>One orbit for research, marketing, sales, clients and execution.</h2><p>Turn business questions into market studies, campaigns, sales packs, prospects and tasks. Every external action stays human-approved.</p><div class="command"><input id="cmd" class="input" placeholder="Try: research Dubai restaurant market"><button class="btn ai" onclick="command()">Run</button></div><div class="orb"></div></div><div class="grid g4" style="margin-top:12px">'+card('Clients','<div class="metric">2</div><div class="muted">Al Eliza · Nostaza</div>')+card('Tasks','<div class="metric">'+S.tasks.length+'</div><div class="muted">Agency workload</div>')+card('Prospects','<div class="metric">'+S.leads.length+'</div><div class="muted">CRM pipeline</div>')+card('Studies','<div class="metric">'+S.studies.length+'</div><div class="muted">Market intelligence</div>')+'</div><div class="grid g2" style="margin-top:12px">'+card('Quick actions','<div class="toolbar"><button class="btn primary" onclick="show(\'research\')">New market study</button><button class="btn" onclick="show(\'marketing\')">Build campaign</button><button class="btn" onclick="show(\'sales\')">Create sales pack</button><button class="btn" onclick="newTask()">New task</button></div>')+card('Business briefing','<div class="result">Priority: convert hospitality market intelligence into a focused prospect list. Next: create a vertical offer, campaign concept and personalized outreach sequence.</div>')+'</div>'}
function command(){let q=(document.getElementById('cmd').value||'').toLowerCase();show(q.includes('research')||q.includes('market')||q.includes('hotel')?'research':q.includes('marketing')||q.includes('campaign')?'marketing':q.includes('sales')||q.includes('lead')?'sales':q.includes('task')?'tasks':'ai')}
function research(){return '<div class="grid g2"><div class="card"><div class="ey">Research Intelligence</div><h2>Market Study Engine</h2><p class="muted">Structured market intelligence for opportunity discovery. Outputs are planning analysis; live claims require connected data sources.</p><div class="form"><label>Market<input id="rm" class="input" value="Hospitality"></label><label>Geography<input id="rg" class="input" value="Dubai, UAE"></label><label>Audience<input id="ra" class="input" value="Hotels, restaurants and hospitality groups"></label><label>Offer<input id="ro" class="input" value="Digital marketing, AI automation and business intelligence"></label><label>Question<textarea id="rq" class="area">What are the strongest growth opportunities and sales angles?</textarea></label><button class="btn primary" onclick="study()">Run market study</button></div></div><div class="card"><b>Research layers</b><div class="row">Market structure <span class="tag">Map</span></div><div class="row">Customer needs <span class="tag">Segment</span></div><div class="row">Competitor lens <span class="tag amber">Compare</span></div><div class="row">Opportunity map <span class="tag">Prioritize</span></div><div class="row">Go-to-market <span class="tag">Action</span></div><div class="row">Evidence checklist <span class="tag red">Verify</span></div></div></div><div id="studyOut"></div>'}
function study(){let m=rm.value,g=rg.value,a=ra.value,o=ro.value,q=rq.value;let x='MARKET STUDY — '+m+' / '+g+'\n\nMARKET STRUCTURE\nMap demand by segment, price point, acquisition channel and service category. Separate established operators from digital-first entrants.\n\nCUSTOMER NEEDS\nAudience: '+a+'\nLikely needs: measurable acquisition, content velocity, conversion improvement, reputation, retention and automation.\n\nCOMPETITIVE LENS\nCompare agencies, freelancers, in-house teams and vertical software on specialization, price, speed, proof, reporting and automation.\n\nOPPORTUNITY MAP\nOffer: '+o+'\nEntry: audit → quick-win roadmap → monthly growth system. Expansion: CRM, AI automation, ads, SEO, reporting and conversion.\n\nSALES ANGLES\nLead with measurable outcomes, a verticalized offer and a 30-day action plan.\n\nRESEARCH QUESTION\n'+q+'\n\nEVIDENCE TO VERIFY\n• Current competitor offers and pricing\n• Search/social demand signals\n• Ad creative patterns\n• Customer reviews and recurring complaints\n• Local platform economics and regulations\n\nSTATUS: Planning intelligence. Connect approved live sources before treating measurements as current facts.';S.studies.push([m,g,new Date().toISOString()]);save();document.getElementById('studyOut').innerHTML='<div class="card" style="margin-top:12px"><b>Study output</b><div class="result">'+x+'</div><button class="btn" onclick="copyText()">Copy</button><button class="btn primary" onclick="addTask(\'Validate research evidence\')">Create validation task</button></div>';window.studyText=x;toast('Market study created')}
function marketing(){return '<div class="grid g2"><div class="card"><div class="ey">Marketing AI</div><h2>Campaign Builder</h2><div class="form"><label>Brand<input id="mb" class="input" value="Nostaza Restaurant"></label><label>Objective<select id="mo" class="select"><option>Generate leads</option><option>Increase orders</option><option>Brand awareness</option><option>Retention</option></select></label><label>Audience<input id="ma" class="input" value="Dubai food lovers and nearby residents"></label><label>Offer<input id="mf" class="input" value="Fried chicken, meals and delivery"></label><label>Channel<select id="mc" class="select"><option>Instagram + Meta Ads</option><option>Google Ads</option><option>Organic social</option><option>Multi-channel</option></select></label><button class="btn ai" onclick="campaign()">Generate campaign</button></div></div><div id="mk" class="card"><b>Marketing intelligence</b><div class="result">Generate hooks, creative directions, funnel, CTA and measurement plan.</div></div></div>'}
function campaign(){let b=mb.value,o=mo.value,a=ma.value,f=mf.value,c=mc.value;let x='CAMPAIGN — '+b+'\nObjective: '+o+'\nAudience: '+a+'\nOffer: '+f+'\nChannel: '+c+'\n\nHOOKS\n1. Product-first visual in first 2 seconds.\n2. Proof: product, reviews, speed and convenience.\n3. Local CTA with a clear reason to act.\n\nFUNNEL\nAwareness → Proof → Offer → Conversion → Retarget → Retain.\n\nCREATIVES\nA Reel · B Offer poster · C Review/proof · D Behind-the-scenes.\n\nMEASURE\nCTR, cost per lead/order, conversion rate, attributed revenue, repeat purchase.\n\nAPPROVAL\nReview budget, targeting and creative before publishing.';mk.innerHTML='<b>Generated campaign</b><div class="result">'+x+'</div><button class="btn primary" onclick="addTask(\'Review '+b+' campaign\')">Create task</button>';window.studyText=x;toast('Campaign generated')}
function sales(){return '<div class="grid g2"><div class="card"><div class="ey">Sales AI</div><h2>Prospect & Outreach Engine</h2><div class="form"><label>Prospect/company<input id="sc" class="input" placeholder="Dubai hotel group"></label><label>Need<input id="sn" class="input" value="More qualified leads and stronger conversion"></label><label>Decision maker<input id="sp" class="input" placeholder="Owner / Marketing Manager"></label><label>Offer<input id="so" class="input" value="AI-powered marketing and growth system"></label><button class="btn ai" onclick="salesPack()">Create sales pack</button></div></div><div id="sox" class="card"><b>Sales intelligence</b><div class="result">Discovery questions, positioning, cold email and follow-up sequence will be generated here.</div></div></div><div class="card" style="margin-top:12px"><b>CRM pipeline</b><div class="toolbar"><button class="btn primary" onclick="newLead()">+ Add prospect</button></div><div id="leads"></div></div>'}
function salesPack(){let c=sc.value,n=sn.value,p=sp.value||'there',o=so.value;let x='SALES PACK — '+c+'\n\nPOSITIONING\nFor '+c+', '+o+' can be positioned around: '+n+'.\n\nDISCOVERY\n• What channel produces your best leads/orders?\n• Where do prospects drop?\n• Which repetitive work costs the most time?\n• Which KPI matters most this quarter?\n\nCOLD EMAIL\nSubject: A practical growth idea for '+c+'\n\nHi '+p+',\nI work with businesses on digital growth, creative production and automation. I would like to share a short growth map focused on '+n.toLowerCase()+'.\n\nFOLLOW-UP 1\nSend one specific observation and one quick win.\nFOLLOW-UP 2\nOffer a 15-minute walkthrough.\n\nNEXT ACTION\nResearch the account, personalize evidence, then send after human review.';sox.innerHTML='<b>Sales pack</b><div class="result">'+x+'</div><button class="btn" onclick="copyText()">Copy</button>';window.studyText=x;toast('Sales pack generated')}
function renderLeads(){let e=document.getElementById('leads');if(!e)return;e.innerHTML=S.leads.length?S.leads.map((x,i)=>'<div class="row"><span><b>'+x+'</b><small class="muted" style="display:block">New Lead · Manual</small></span><button class="btn" onclick="delLead('+i+')">Remove</button></div>').join(''):'<div class="muted" style="padding:18px">No prospects yet.</div>'}
function newLead(){let x=prompt('Prospect/company name');if(!x)return;S.leads.push(x);save();renderLeads();toast('Prospect added')}
function delLead(i){S.leads.splice(i,1);save();renderLeads()}
function clients(){return '<div class="grid g2">'+card('Al Eliza Interiors','<div class="muted">Qatar / Dubai</div><p>Website · SEO · Digital growth</p><button class="btn primary" onclick="show(\'projects\')">Open workspace</button>')+card('Nostaza Restaurant','<div class="muted">Al Warqa, Dubai</div><p>Social · Delivery · Growth</p><button class="btn primary" onclick="show(\'marketing\')">Open growth</button>')+'</div><div class="card" style="margin-top:12px">Hotels and restaurants beyond these two are <b>prospects</b>, not current clients.</div>'}
function projects(){return '<div class="grid g2">'+['Nostaza Growth Engine','Al Eliza Lead Engine','Lunes AI','Hospitality Outreach','Content Engine','AI Reporting Copilot'].map(x=>card(x,'<div class="row">Status <span class="tag">Active / Planned</span></div><button class="btn primary" onclick="addTask(\'Work on '+x+'\')">Create task</button>')).join('')+'</div>'}
function tasks(){return '<div class="card"><b>Agency Task Board</b><div class="toolbar"><button class="btn primary" onclick="newTask()">+ New task</button></div><div class="kanban">'+['Open','Today','Review','Done'].map(c=>'<div class="col"><b>'+c+'</b>'+S.tasks.filter(t=>t[2]==c).map(t=>'<div class="task"><b>'+t[0]+'</b><div class="muted">'+t[1]+'</div><button class="btn" onclick="moveTask('+S.tasks.indexOf(t)+')">Move</button></div>').join('')+'</div>').join('')+'</div></div>'}
function newTask(){let x=prompt('Task name');if(x)addTask(x)}
function addTask(x){S.tasks.push([x,'Medium','Open']);save();show('tasks');toast('Task created')}
function moveTask(i){let o=['Open','Today','Review','Done'],n=(o.indexOf(S.tasks[i][2])+1)%4;S.tasks[i][2]=o[n];save();show('tasks');toast('Task moved')}
function team(){return '<div class="grid g2">'+[['Amal','Partner','Strategy'],['Adhil','Partner','Operations'],['Aneesh','Design','Creative'],['Satheesh','AI & Development','Technology']].map(x=>card(x[0],'<div class="muted">'+x[1]+' · '+x[2]+'</div><div class="toolbar"><button class="btn" onclick="toast(\'Messaging workspace ready\')">Message</button><button class="btn primary" onclick="addTask(\'Task for '+x[0]+'\')">Assign task</button></div>')).join('')+'</div>'}
function ai(){return '<div class="card hero"><div class="ey">Prism Intelligence</div><h2>Business copilot.</h2><p>Route a question into research, marketing, sales or operations. The workflows are live inside this workspace; external actions remain approval-gated.</p><div class="grid g3" style="margin-top:15px">'+[['Research market','research'],['Build campaign','marketing'],['Create sales pack','sales'],['Review clients','clients'],['Plan tasks','tasks'],['Executive report','reports']].map(x=>'<button class="btn" style="text-align:left;padding:15px" onclick="show(\''+x[1]+'\')">'+x[0]+'<div class="muted">Open workflow →</div></button>').join('')+'</div></div>'}
function reports(){return '<div class="grid g3">'+card('Market studies','<div class="metric">'+S.studies.length+'</div><div class="muted">Research outputs</div>')+card('Prospects','<div class="metric">'+S.leads.length+'</div><div class="muted">CRM records</div>')+card('Tasks','<div class="metric">'+S.tasks.length+'</div><div class="muted">Execution</div>')+'</div><div class="card" style="margin-top:12px"><b>Executive view</b><div class="result">Prism Orbit combines client operations, market research, marketing planning, sales enablement and task execution. Live platform metrics require authorized data integrations.</div></div>'}
function notifications(){return '<div class="card"><b>Notifications</b><div class="row">Research engine ready <span class="tag">AI</span></div><div class="row">Sales outreach requires review <span class="tag amber">Approval</span></div><div class="row">Live ad/social metrics require authorization <span class="tag">Integration</span></div></div>'}
function settings(){return '<div class="grid g2">'+card('Workspace','<div class="row">Local data <span class="tag">Browser</span></div><div class="row">Role model <span class="tag">Partner / Specialist</span></div><button class="btn" onclick="resetAll()">Reset local workspace</button>')+card('Integrations','<div class="row">Supabase <span class="tag">Ready for backend</span></div><div class="row">Gmail / Calendar <span class="tag amber">Authorize</span></div><div class="row">Meta / Instagram <span class="tag amber">Authorize</span></div><div class="row">Research sources <span class="tag amber">Connect</span></div>')+'</div>'}
function resetAll(){if(confirm('Reset local Prism Orbit data?')){localStorage.removeItem(K);location.reload()}}
function copyText(){if(window.studyText)navigator.clipboard?.writeText(window.studyText);toast('Copied')}
const P={home,research,marketing,sales,clients,projects,tasks,team,ai,reports,notifications,settings};
document.getElementById('nav').innerHTML=N.map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+' &nbsp; '+x[2]+'</button>').join('');
document.getElementById('bottom').innerHTML=N.slice(0,5).map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');
document.getElementById('pages').innerHTML=Object.entries(P).map(x=>'<section id="p-'+x[0]+'" class="page">'+x[1]()+'</section>').join('');
show('home');renderLeads();
</script></body></html>
