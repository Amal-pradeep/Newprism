;transform:rotate(20deg)}.r2{width:360px;right:-40px;top:210px;transform:rotate(-17deg);animation-delay:1s}.r3{width:330px;right:30px;top:155px;transform:rotate(5deg);animation-delay:2s}@keyframes pulse{50%{opacity:.25;filter:blur(2px)}}.metric{font-size:30px;font-weight:900;margin:6px 0}.metric.p{background:linear-gradient(90deg,#d8b4ff,#ec4899);-webkit-background-clip:text;color:transparent}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:8px}.tag{font-size:10px;padding:4px 8px;border-radius:99px;background:#a855f71c;color:#d8b4ff}.amber{color:var(--gold);background:#f5c76a14}.red{color:var(--danger);background:#fb718514}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--muted)}.form .input,.form .select,.form .area{width:100%;margin-top:5px}.area{min-height:100px;resize:vertical}.result{white-space:pre-wrap;line-height:1.6;background:#05030a99;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.col{min-height:220px;background:#ffffff04;border:1px solid var(--line);border-radius:14px;padding:9px}.task{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0d0915;margin-top:7px}.task b{display:block;margin-bottom:4px}.module{padding:16px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(135deg,#ffffff09,#ffffff03);cursor:pointer}.module:hover{border-color:#a855f755}.module .icon{font-size:22px;margin-bottom:9px}.timeline{border-left:1px solid #a855f755;margin:12px 0 0 7px;padding-left:18px}.timeline div{position:relative;margin:0 0 15px}.timeline div:before{content:"";position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:#a855f7;box-shadow:0 0 12px #a855f7}.bottom{display:none}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;background:#140d20ee;border:1px solid #a855f755;border-radius:13px;display:none;z-index:50;box-shadow:0 15px 50px #0008}.toast.on{display:block}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:none;place-items:center;z-index:40;padding:20px}.modal.on{display:grid}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;border:1px solid #a855f755;background:#10091aee;border-radius:22px;padding:20px;box-shadow:0 30px 100px #000}.statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c084fc;box-shadow:0 0 12px #c084fc;margin-right:5px}

<script>
const SUPABASE_URL='https://vxejoefeufqaplfsbcpy.supabase.co';
const SUPABASE_KEY='sb_publishable_2YRXqqCNGeIf65o_Rqx3OA_lLe_9Lmf';
let AUTH=null, ORBIT_WORKSPACE=null;
const sb={
  async request(path,options={}){
    const headers=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'},options.headers||{});
    if(AUTH?.access_token) headers.Authorization='Bearer '+AUTH.access_token;
    const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},options,{headers}));
    if(!r.ok) throw new Error('Supabase '+r.status+': '+await r.text());
    return r.status===204?null:r.json();
  },
  from(table){
    const self=this;
    return {
      insert(row){return {async then(resolve,reject){try{const v=await self.request(table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row)});resolve(v)}catch(e){reject(e)}}}},
      async select(){return self.request(table)},
      async update(row){return self.request(table,{method:'PATCH',body:JSON.stringify(row)})}
    };
  }
};
async function cloudTask(title,priority='medium'){
  if(!AUTH||!ORBIT_WORKSPACE)return;
  try{await sb.request('orbit_tasks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({workspace_id:ORBIT_WORKSPACE,title,priority,created_by:AUTH.user?.id||AUTH.id})})}catch(e){console.warn('cloudTask',e)}
}
async function initAuth(){
  try{
    const raw=localStorage.getItem('prism_orbit_auth');
    if(raw) AUTH=JSON.parse(raw);
    if(AUTH?.access_token){
      const u=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+AUTH.access_token}});
      if(!u.ok) throw new Error('session expired');
      const user=await u.json(); AUTH.user=user; AUTH.id=user.id;
      const ws=await fetch(SUPABASE_URL+'/rest/v1/orbit_members?user_id=eq.'+user.id+'&select=workspace_id&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+AUTH.access_token}});
      if(ws.ok){const rows=await ws.json(); if(rows[0]) ORBIT_WORKSPACE=rows[0].workspace_id;}
    }
  }catch(e){AUTH=null;ORBIT_WORKSPACE=null;localStorage.removeItem('prism_orbit_auth');console.warn('Auth boot',e)}
}
function safeBoot(){
  window.addEventListener('error',e=>{console.error(e.error||e.message);toast('Orbit recovered from a UI error.');});
  try{show('home');renderLeads();renderTasks();initAuth();}catch(e){console.error(e);document.getElementById('pages').innerHTML='<section class="page active"><div class="card"><h2>Orbit Core</h2><p class="muted">The interface recovered from a startup error.</p><button class="btn primary" onclick="location.reload()">Reload Orbit</button></div></section>'}
}
const KEY='prism_orbit_v10';
const NAV=[
['home','⌂','Command Center'],['research','⌕','Research Intelligence'],['marketing','◎','Marketing AI'],['sales','↗','Sales AI'],['clients','◇','Clients'],['projects','▣','Projects'],['tasks','✓','Tasks'],['team','◉','Team'],['chat','☏','Prism Chat'],['growth','✦','Growth'],['finance','◈','Finance'],['ai','✧','Orbit AI'],['reports','▤','Reports'],['notifications','🔔','Notifications'],['settings','⚙','Settings']
];
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{
tasks:[['Review Nostaza campaign','High','Today'],['Prepare Dubai hospitality prospects','High','Open'],['Aneesh — restaurant reel','Creative','Open'],['Satheesh — Lunes AI automation','Technical','Open']],
leads:[],studies:[],messages:[],finance:{revenue:0,receivable:0,expense:0}
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const toast=x=>{const e=document.getElementById('toast');e.textContent=x;e.className='toast on';clearTimeout(window.tt);window.tt=setTimeout(()=>e.className='toast',2200)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(k){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));const p=document.getElementById('p-'+k);if(!p)return; p.classList.add('active');document.getElementById('title').textContent=(NAV.find(x=>x[0]===k)||['','',k])[2];document.querySelectorAll('[data-k]').forEach(e=>e.classList.toggle('active',e.dataset.k===k));scrollTo(0,0);if(k==='sales')renderLeads();if(k==='tasks')renderTasks()}
function card(t,b){return '<div class="card"><b>'+t+'</b>'+b+'</div>'}
function home(){return '<div class="card hero"><div class="ey">Living business intelligence</div><h2>Your business, in one orbit.</h2><p>Research markets. Discover prospects. Build campaigns. Manage clients. Coordinate your team. Watch growth. Ask Orbit what needs your attention — and keep every external action human-approved.</p><div class="command"><input id="cmd" class="input" placeholder="“Orbit, find Dubai hotel opportunities”" onkeydown="if(event.key===\'Enter\')command()"><button class="btn ai" onclick="command()">Ask Orbit</button><button class="btn" onclick="openVoice()">🎙</button></div><div class="core"></div><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div></div><div class="card orbitArchitecture" style="margin-top:12px;overflow:hidden;position:relative"><div class="ey">ORBIT SYSTEM ARCHITECTURE</div><h2 style="font-size:28px;margin:7px 0">Observe. Think. Decide. Execute. Learn.</h2><p class="muted">The new Prism Orbit model is designed as an operating layer for Prism of Stories — not a static dashboard.</p><div class="archGrid"><div class="archNode"><b>01 · SIGNALS</b><span>Gmail · Calendar · Meta · Instagram · Ads · Search · CRM</span></div><div class="archArrow">↓</div><div class="archNode hot"><b>02 · ORBIT INTELLIGENCE</b><span>AI reasoning · market research · sales intelligence · marketing intelligence · anomaly detection</span></div><div class="archArrow">↓</div><div class="archNode"><b>03 · MEMORY</b><span>Supabase · clients · team · tasks · research · conversations · business knowledge</span></div><div class="archArrow">↓</div><div class="archNode"><b>04 · ACTION ENGINE</b><span>Draft · assign · schedule · update CRM · create tasks · prepare campaigns</span></div><div class="archArrow">↓</div><div class="archNode approval"><b>05 · HUMAN APPROVAL</b><span>Orbit proposes. Amal / Adhil approve sensitive external actions.</span></div><div class="archArrow">↓</div><div class="archNode"><b>06 · FEEDBACK LOOP</b><span>Results return to Orbit so recommendations become progressively more contextual.</span></div></div><div class="systemPills"><span>● SUPABASE READY</span><span>◌ AI ENDPOINT READY</span><span>◌ GMAIL AUTH</span><span>◌ CALENDAR AUTH</span><span>◌ META AUTH</span><span>◌ CRM CONNECTOR</span></div></div><div class="grid g4" style="margin-top:12px">'+card('Clients','<div class="metric p">2</div><div class="muted">Al Eliza · Nostaza</div>')+card('Tasks','<div class="metric">'+S.tasks.length+'</div><div class="muted">Agency workload</div>')+card('Prospects','<div class="metric">'+S.leads.length+'</div><div class="muted">CRM pipeline</div>')+card('Studies','<div class="metric">'+S.studies.length+'</div><div class="muted">Research outputs</div>')+'</div><div class="grid g3" style="margin-top:12px">'+[['⌕','Research','Scan markets and opportunities','research'],['◎','Marketing','Build growth systems','marketing'],['↗','Sales','Research and convert prospects','sales'],['◇','Clients','Manage client growth','clients'],['◉','Team','Assign and collaborate','team'],['✦','Growth','See the next moves','growth']].map(x=>'<div class="module" onclick="show(\''+x[3]+'\')"><div class="icon">'+x[0]+'</div><b>'+x[1]+'</b><div class="muted" style="margin-top:5px">'+x[2]+'</div></div>').join('')+'</div><div class="grid g2" style="margin-top:12px">'+card('Orbit briefing','<div class="timeline"><div><b>Current clients</b><br><span class="muted">Al Eliza Interiors · Nostaza Restaurant</span></div><div><b>Growth focus</b><br><span class="muted">Dubai hospitality prospecting and client expansion</span></div><div><b>Next action</b><br><span class="muted">Turn research into personalized sales outreach.</span></div></div>')+card('Quick actions','<div class="toolbar"><button class="btn primary" onclick="show(\'research\')">New market study</button><button class="btn ai" onclick="show(\'sales\')">Find prospects</button><button class="btn" onclick="show(\'marketing\')">Build campaign</button><button class="btn" onclick="newTask()">New task</button></div>')+'</div>'}
function command(){let q=(document.getElementById('cmd')?.value||'').toLowerCase();if(!q)return toast('Tell Orbit what you need.');if(/research|market|competitor|hotel|restaurant|industry/.test(q)){show('research');toast('Orbit routed this to Research Intelligence');}else if(/market|campaign|content|instagram|ad/.test(q)){show('marketing');toast('Orbit routed this to Marketing AI');}else if(/sales|lead|prospect|client|outreach|email/.test(q)){show('sales');toast('Orbit routed this to Sales AI');}else if(/task|team|assign|aneesh|satheesh|adhil/.test(q)){show('tasks');toast('Orbit routed this to Operations');}else if(/money|finance|revenue|expense|payment/.test(q)){show('finance');toast('Orbit routed this to Finance');}else{show('ai');toast('Orbit is ready for that workflow');}}
function research(){return '<div class="grid g2"><div class="card"><div class="ey">Research Intelligence</div><h2>Market Study Engine</h2><p class="muted">Build a structured research brief, opportunity map, competitor lens and evidence checklist. This prototype does not invent live measurements; connect approved data sources for verified current facts.</p><div class="form"><label>Market<input id="rm" class="input" value="Hospitality"></label><label>Geography<input id="rg" class="input" value="Dubai, UAE"></label><label>Audience<input id="ra" class="input" value="Hotels, restaurants and hospitality groups"></label><label>Offer<input id="ro" class="input" value="Digital marketing, AI automation and business intelligence"></label><label>Research question<textarea id="rq" class="area">What growth gaps can Prism solve, and which evidence should we verify?</textarea></label><button class="btn primary" onclick="study()">Run market study</button></div></div><div class="card"><b>Research layers</b><div class="row">Market structure <span class="tag">Map</span></div><div class="row">Customer needs <span class="tag">Segment</span></div><div class="row">Competitor intelligence <span class="tag">Compare</span></div><div class="row">Opportunity map <span class="tag">Prioritize</span></div><div class="row">Sales angles <span class="tag">Convert</span></div><div class="row">Evidence checklist <span class="tag amber">Verify</span></div><div class="row">Save to client <span class="tag">Workspace</span></div></div></div><div id="studyOut"></div>'}
async function study(){let m=rm.value,g=rg.value,a=ra.value,o=ro.value,q=rq.value;let x='MARKET STUDY — '+m+' / '+g+'\n\n1. MARKET STRUCTURE\nMap demand by segment, price point, acquisition channel, platform dependency and service category. Separate established operators from digital-first entrants.\n\n2. CUSTOMER NEEDS\nAudience: '+a+'\nLikely needs to validate: qualified acquisition, content velocity, conversion, reputation, retention, reporting and automation.\n\n3. COMPETITIVE LENS\nCompare agencies, freelancers, in-house teams and vertical software on specialization, price, proof, speed, reporting and automation.\n\n4. OPPORTUNITY MAP\nOffer: '+o+'\nEntry: audit → quick-win roadmap → monthly growth system. Expansion: CRM, AI automation, ads, SEO, reporting and conversion.\n\n5. SALES ANGLES\nLead with measurable outcomes, vertical expertise and a 30-day action plan.\n\n6. EVIDENCE TO VERIFY\n• Current competitor offers and pricing\n• Search/social demand signals\n• Ad creative patterns\n• Customer reviews and recurring complaints\n• Local platform economics and regulations\n\nRESEARCH QUESTION\n'+q+'\n\nSTATUS: Planning intelligence. Current market measurements must come from authorized live sources.';S.studies.push([m,g,new Date().toISOString()]);save();window.out=x;document.getElementById('studyOut').innerHTML='<div class="card" style="margin-top:12px"><b>Study output</b><div class="result">'+esc(x)+'</div><div class="toolbar"><button class="btn" onclick="copyOut()">Copy</button><button class="btn primary" onclick="addTask(\'Validate research evidence — '+esc(m)+'\')">Create validation task</button></div></div>';toast('Research study created');if(AUTH&&window.ORBIT_WORKSPACE)sb.from('orbit_research').insert({workspace_id:window.ORBIT_WORKSPACE,title:m+' — '+g,query:q,output:{audience:a,offer:o,brief:x},created_by:AUTH.id})}
function marketing(){return '<div class="grid g2"><div class="card"><div class="ey">Marketing AI</div><h2>Campaign Architect</h2><p class="muted">Turn a business objective into hooks, creative systems, funnel stages and measurable KPIs.</p><div class="form"><label>Brand<input id="mb" class="input" value="Nostaza Restaurant"></label><label>Objective<select id="mo" class="select"><option>Increase orders</option><option>Generate leads</option><option>Brand awareness</option><option>Retention</option></select></label><label>Audience<input id="ma" class="input" value="Dubai food lovers and nearby residents"></label><label>Offer<input id="mf" class="input" value="Fried chicken, meals and delivery"></label><label>Channels<select id="mc" class="select"><option>Instagram + Meta Ads</option><option>Google Ads</option><option>Organic social</option><option>Multi-channel</option></select></label><button class="btn ai" onclick="campaign()">Generate growth campaign</button></div></div><div id="mk" class="card"><b>Marketing intelligence</b><div class="result">Orbit will create a campaign architecture, creative set, funnel and measurement plan.</div></div></div>'}
async function campaign(){let b=mb.value,o=mo.value,a=ma.value,f=mf.value,c=mc.value;let x='CAMPAIGN — '+b+'\nObjective: '+o+'\nAudience: '+a+'\nOffer: '+f+'\nChannels: '+c+'\n\nHOOKS\n1. Product-first visual in first 2 seconds.\n2. Proof through product, reviews, convenience and speed.\n3. Local CTA with a clear reason to act.\n\nFUNNEL\nAwareness → Proof → Offer → Conversion → Retarget → Retain.\n\nCREATIVE SYSTEM\nA. Hero Reel · B. Offer poster · C. Customer proof · D. Behind-the-scenes · E. FAQ/objection.\n\nMEASUREMENT\nCTR · cost per lead/order · conversion rate · attributed revenue · repeat purchase.\n\nAPPROVAL GATE\nHuman review required before publishing or spending ad budget.';window.out=x;mk.innerHTML='<b>Generated campaign</b><div class="result">'+esc(x)+'</div><div class="toolbar"><button class="btn" onclick="copyOut()">Copy</button><button class="btn primary" onclick="addTask(\'Review '+esc(b)+' campaign\')">Create task</button></div>';toast('Campaign generated')}
function sales(){return '<div class="grid g2"><div class="card"><div class="ey">Sales AI</div><h2>Prospect & Outreach Engine</h2><p class="muted">Build a prospecting workflow: research → pain points → positioning → personalized outreach → follow-up → CRM task.</p><div class="form"><label>Prospect/company<input id="sc" class="input" placeholder="Dubai hotel group"></label><label>Need<input id="sn" class="input" value="More qualified leads and stronger conversion"></label><label>Decision maker<input id="sp" class="input" placeholder="Owner / Marketing Manager"></label><label>Offer<input id="so" class="input" value="AI-powered marketing and growth system"></label><button class="btn ai" onclick="salesPack()">Create sales pack</button></div></div><div id="sox" class="card"><b>Sales intelligence</b><div class="result">No prospect selected. Orbit can prepare positioning, discovery questions, outreach and follow-up once you enter an account.</div></div></div><div class="card" style="margin-top:12px"><b>CRM pipeline</b><div class="toolbar"><button class="btn primary" onclick="newLead()">+ Add prospect</button><button class="btn" onclick="addTask('Follow up all open hospitality prospects')">Create follow-up task</button></div><div id="leads"></div></div>'}
async function salesPack(){let c=sc.value,n=sn.value,p=sp.value||'there',o=so.value;if(!c)return toast('Enter a prospect first.');let x='SALES PACK — '+c+'\n\nPOSITIONING\nFor '+c+', position '+o+' around the business need: '+n+'.\n\nDISCOVERY QUESTIONS\n• What channel currently produces your best leads/orders?\n• Where do prospects or customers drop?\n• Which repetitive work costs the most time?\n• Which KPI matters most this quarter?\n\nPERSONALIZED COLD EMAIL\nSubject: A practical growth idea for '+c+'\n\nHi '+p+',\nI work with businesses on digital growth, creative production and automation. I would like to share a short growth map focused on '+n.toLowerCase()+'.\n\nFOLLOW-UP SEQUENCE\nDay 2 — one specific observation + one quick win.\nDay 5 — proof/case study relevant to the account.\nDay 10 — simple 15-minute walkthrough invitation.\n\nNEXT ACTION\nResearch the account, personalize evidence and send only after human review.';window.out=x;sox.innerHTML='<b>Sales pack</b><div class="result">'+esc(x)+'</div><div class="toolbar"><button class="btn" onclick="copyOut()">Copy</button><button class="btn primary" onclick="addLeadFromForm()">Save prospect</button></div>';toast('Sales pack generated')}
function renderLeads(){let e=document.getElementById('leads');if(!e)return;e.innerHTML=S.leads.length?S.leads.map((x,i)=>'<div class="row"><span><b>'+esc(x)+'</b><small class="muted" style="display:block">New Lead · Human-owned</small></span><button class="btn" onclick="delLead('+i+')">Remove</button></div>').join(''):'<div class="muted" style="padding:18px">No prospects yet. Use Add prospect or Sales AI.</div>'}
function newLead(){let x=prompt('Prospect/company name');if(x){S.leads.push(x.trim());save();renderLeads();toast('Prospect added')}}
function addLeadFromForm(){if(sc.value){S.leads.push(sc.value.trim());save();renderLeads();toast('Prospect saved to CRM')}}
function delLead(i){S.leads.splice(i,1);save();renderLeads();toast('Prospect removed')}
function clients(){return '<div class="grid g2">'+card('Al Eliza Interiors','<div class="muted">Qatar / Dubai · Current client</div><p>Website · SEO · Digital growth · Lead generation</p><div class="toolbar"><button class="btn primary" onclick="addTask(\'Review Al Eliza growth\')">Growth review</button><button class="btn" onclick="show(\'marketing\')">Marketing AI</button></div>')+card('Nostaza Restaurant','<div class="muted">Al Warqa, Dubai · Current client</div><p>Social · Delivery · Content · Growth</p><div class="toolbar"><button class="btn primary" onclick="show(\'marketing\')">Build campaign</button><button class="btn" onclick="addTask(\'Review Nostaza growth\')">Growth review</button></div>')+'</div><div class="card" style="margin-top:12px"><b>Prospecting boundary</b><p class="muted">Hotels, restaurants and hospitality groups beyond these two are treated as prospects until won. Orbit does not invent client relationships.</p></div>'}
function projects(){return '<div class="grid g2">'+['Nostaza Growth Engine','Al Eliza Lead Engine','Lunes AI','Hospitality Outreach','Content Engine','AI Reporting Copilot'].map(x=>card(x,'<div class="row">Stage <span class="tag">Active / Planned</span></div><p class="muted">Owner and next action can be assigned through Tasks and Team.</p><button class="btn primary" onclick="addTask(\'Work on '+x+'\')">Create task</button>')).join('')+'</div>'}
function renderTasks(){let e=document.getElementById('taskboard');if(!e)return;e.innerHTML=['Open','Today','Review','Done'].map(c=>'<div class="col"><b>'+c+'</b>'+S.tasks.map((t,i)=>t[2]===c?'<div class="task"><b>'+esc(t[0])+'</b><div class="muted">'+esc(t[1])+'</div><button class="btn" onclick="moveTask('+i+')">Move →</button></div>':'').join('')+'</div>').join('')}
function tasks(){return '<div class="card"><b>Agency Task Board</b><p class="muted">Amal/Adhil can assign. Aneesh and Satheesh can receive specialist work.</p><div class="toolbar"><button class="btn primary" onclick="newTask()">+ New task</button><button class="btn" onclick="show(\'team\')">Assign to team</button></div><div id="taskboard" class="kanban" style="margin-top:10px"></div></div>'}
function newTask(){let x=prompt('Task name');if(x)addTask(x)}
function addTask(x){S.tasks.push([x,'Medium','Open']);save();if(AUTH)cloudTask(x,'medium');show('tasks');renderTasks();toast('Task created')}
function moveTask(i){let o=['Open','Today','Review','Done'];S.tasks[i][2]=o[(o.indexOf(S.tasks[i][2])+1)%4];save();renderTasks();toast('Task moved')}
function team(){return '<div class="grid g2">'+[['Amal','Partner','Strategy'],['Adhil','Partner','Operations'],['Aneesh','Design','Creative'],['Satheesh','AI & Development','Technology']].map(x=>card(x[0],'<div class="muted">'+x[1]+' · '+x[2]+'</div><div class="toolbar"><button class="btn" onclick="openChat(\''+x[0]+'\')">Message</button><button class="btn primary" onclick="assignTo(\''+x[0]+'\')">Assign task</button></div>')).join('')+'</div><div class="card" style="margin-top:12px"><b>Team workflow</b><div class="result">Amal / Adhil → assign → specialist work → review → approval → complete. Notifications and audit history are designed to sit on top of connected backend data.</div></div>'}
function chat(){return '<div class="grid g2"><div class="card"><div class="ey">Prism Chat</div><h2>Internal command room</h2><div id="chatlog" class="result">'+(S.messages.length?S.messages.map(m=>esc(m)).join('\n\n'):'No messages yet.')+'</div><div class="command" style="margin-top:10px"><input id="chatin" class="input" placeholder="Message the Prism team"><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="card"><b>Channels</b><div class="row"># prism-team <span class="tag">Team</span></div><div class="row"># nostaza-growth <span class="tag">Client</span></div><div class="row"># lunes-ai <span class="tag">Product</span></div><div class="row"># hospitality-sales <span class="tag">Growth</span></div></div></div>'}
function sendChat(){let x=chatin.value.trim();if(!x)return;S.messages.push('Amal: '+x);save();show('chat');toast('Message added')}
function openChat(n){show('chat');toast('Chat opened for '+n)}
function assignTo(n){let x=prompt('Task for '+n);if(x){S.tasks.push([x,'Assigned to '+n,'Open']);save();toast('Assigned to '+n)}}
function growth(){return '<div class="grid g3">'+card('Client expansion','<div class="metric p">2</div><div class="muted">Current clients with expansion opportunities to review.</div><button class="btn primary" onclick="addTask(\'Review client expansion opportunities\')">Create review</button>')+card('Hospitality acquisition','<div class="metric">→</div><div class="muted">Target segment: Dubai hotels, restaurants and hospitality groups.</div><button class="btn ai" onclick="show(\'sales\')">Open Sales AI</button>')+card('Agency systems','<div class="metric">AI</div><div class="muted">Research → sales → marketing → execution loop.</div><button class="btn" onclick="show(\'ai\')">Open Orbit</button>')+'</div><div class="card" style="margin-top:12px"><b>Growth loop</b><div class="timeline"><div><b>Discover</b><br><span class="muted">Research markets and accounts.</span></div><div><b>Diagnose</b><br><span class="muted">Identify digital and commercial gaps.</span></div><div><b>Propose</b><br><span class="muted">Personalized offer and sales narrative.</span></div><div><b>Execute</b><br><span class="muted">Campaigns, tasks, content and automation.</span></div><div><b>Measure</b><br><span class="muted">Connect real metrics and iterate.</span></div></div></div>'}
function finance(){return '<div class="grid g3">'+card('Revenue','<div class="metric">₹ '+Number(S.finance.revenue).toLocaleString()+'</div><div class="muted">Enter confirmed revenue only.</div>')+card('Receivables','<div class="metric">₹ '+Number(S.finance.receivable).toLocaleString()+'</div><div class="muted">Pending client payments.</div>')+card('Expenses','<div class="metric">₹ '+Number(S.finance.expense).toLocaleString()+'</div><div class="muted">Recorded expenses.</div>')+'</div><div class="card" style="margin-top:12px"><b>Finance controls</b><div class="form" style="max-width:500px;margin-top:12px"><label>Revenue<input id="fr" class="input" type="number" value="'+S.finance.revenue+'"></label><label>Receivables<input id="fq" class="input" type="number" value="'+S.finance.receivable+'"></label><label>Expenses<input id="fe" class="input" type="number" value="'+S.finance.expense+'"></label><button class="btn primary" onclick="saveFinance()">Save figures</button></div></div>'}
function saveFinance(){S.finance={revenue:+fr.value||0,receivable:+fq.value||0,expense:+fe.value||0};save();show('finance');toast('Finance updated')}
function ai(){return '<div class="card hero"><div class="ey">Prism Intelligence</div><h2>Ask Orbit. Get a workflow.</h2><p>Orbit routes business questions into deterministic workflows. Real external actions require authorized integrations and human approval.</p><div class="grid g3" style="margin-top:15px">'+[['⌕','Research market','research'],['◎','Build campaign','marketing'],['↗','Create sales pack','sales'],['◇','Review clients','clients'],['✓','Plan execution','tasks'],['◈','Review finance','finance']].map(x=>'<div class="module" onclick="show(\''+x[2]+'\')"><div class="icon">'+x[0]+'</div><b>'+x[1]+'</b><div class="muted">Open workflow →</div></div>').join('')+'</div></div>'}
function reports(){return '<div class="grid g4">'+card('Clients','<div class="metric p">2</div>')+card('Prospects','<div class="metric">'+S.leads.length+'</div>')+card('Tasks','<div class="metric">'+S.tasks.length+'</div>')+card('Studies','<div class="metric">'+S.studies.length+'</div>')+'</div><div class="grid g2" style="margin-top:12px">'+card('Executive summary','<div class="result">Prism Orbit combines client operations, market research, marketing planning, sales enablement, team execution and business intelligence. Live platform metrics require authorized integrations.</div>')+card('Integration roadmap','<div class="row">Supabase backend <span class="tag">Ready to connect</span></div><div class="row">Gmail / Calendar <span class="tag amber">Authorize</span></div><div class="row">Meta / Instagram <span class="tag amber">Authorize</span></div><div class="row">Research data sources <span class="tag amber">Connect</span></div></div>')+'</div>'}
function notifications(){return '<div class="card"><b>Notifications</b><div class="row">Orbit research engine ready <span class="tag">AI</span></div><div class="row">Sales outreach requires human review <span class="tag amber">Approval</span></div><div class="row">Live social/ad metrics require authorization <span class="tag">Integration</span></div><div class="row">No external messages are sent automatically <span class="tag">Safety</span></div></div>'}
function settings(){return '<div class="grid g2">'+card('Workspace & privacy','<div class="row">Business workspace <span class="tag">Prism</span></div><div class="row">Partner roles <span class="tag">Amal · Adhil</span></div><div class="row">Specialists <span class="tag">Aneesh · Satheesh</span></div><div class="row">External actions <span class="tag amber">Approval required</span></div><button class="btn" onclick="resetAll()">Reset local workspace</button>')+card('Integrations','<div class="row">Supabase <span class="tag">Backend ready</span></div><div class="row">Gmail / Calendar <span class="tag amber">Authorize</span></div><div class="row">Meta / Instagram <span class="tag amber">Authorize</span></div><div class="row">WhatsApp Business API <span class="tag amber">Separate authorization</span></div><div class="row">Research sources <span class="tag amber">Connect</span></div>')+'</div>'}
function openVoice(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){toast('Voice recognition is not supported in this browser.');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-IN';r.interimResults=false;r.onstart=()=>toast('Orbit listening…');r.onerror=()=>toast('Voice input stopped');r.onresult=e=>{const q=e.results[0][0].transcript;toast('Heard: '+q);document.getElementById('cmd')&&(document.getElementById('cmd').value=q);command()};r.start()}
function copyOut(){if(window.out)navigator.clipboard?.writeText(window.out);toast('Copied to clipboard')}
function resetAll(){if(confirm('Reset Prism Orbit local workspace data?')){localStorage.removeItem(KEY);location.reload()}}
function searchAll(q){if(!q)return;const x=q.toLowerCase();const found=NAV.find(n=>n[2].toLowerCase().includes(x));if(found)show(found[0])}
const P={home,research,marketing,sales,clients,projects,tasks,team,chat,growth,finance,ai,reports,notifications,settings};
document.getElementById('nav').innerHTML=NAV.map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join('');
document.getElementById('bottom').innerHTML=NAV.slice(0,5).map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');
document.getElementById('pages').innerHTML=Object.entries(P).map(x=>'<section id="p-'+x[0]+'" class="page">'+x[1]()+'</section>').join('');
safeBoot();
</script>
</body></html>
