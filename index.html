<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>Prism Orbit — Agency OS</title><style>
:root{--bg:#080a0f;--p:#111620dd;--l:#ffffff12;--t:#f6f7fb;--m:#9ca6b5;--g:#67e8a5;--v:#9b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 450px at 85% 0,#254438 0,transparent 60%),radial-gradient(700px 500px at 0 30%,#201a36 0,transparent 60%),var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.side{width:235px;padding:18px 14px;border-right:1px solid var(--l);background:#07090dcc;position:fixed;inset:0 auto 0 0}.brand{font-weight:900;letter-spacing:.12em;padding:10px}.brand small{display:block;color:var(--m);letter-spacing:0;margin-top:5px;font-weight:500}.nav{margin-top:22px;display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--m);text-align:left;padding:11px;border-radius:12px}.nav button:hover,.nav button.active{background:#67e8a512;color:var(--t)}.main{margin-left:235px;padding:22px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.ey{color:var(--g);font-size:10px;text-transform:uppercase;letter-spacing:.16em}.sub{color:var(--m)}h1{margin:5px 0;font-size:27px}.actions{display:flex;gap:8px}.btn,.field{border:1px solid var(--l);background:#ffffff07;color:var(--t);padding:10px 12px;border-radius:12px}.btn.primary{background:linear-gradient(135deg,#78efaf,#42c982);color:#06110a;border:0;font-weight:800}.btn.ai{background:linear-gradient(135deg,#9b8cff,#6355cf);border:0;font-weight:800}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--l);background:linear-gradient(145deg,var(--p),#0c1018cc);border-radius:20px;padding:17px;box-shadow:0 25px 70px #0005}.hero{min-height:300px;position:relative;overflow:hidden}.hero h2{font-size:34px;max-width:600px;margin:14px 0 8px}.hero p{max-width:620px;color:var(--m);line-height:1.65}.orb{position:absolute;right:12%;top:65px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#effff6,#67e8a5 18%,#174d35 52%,#080a0f 72%);box-shadow:0 0 100px #67e8a533}.command{display:flex;gap:8px;max-width:650px;margin-top:22px}.command input{flex:1}.metric{font-size:28px;font-weight:900;margin:7px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--l);border-radius:13px;margin-top:8px}.tag{font-size:10px;color:var(--g);padding:4px 8px;border-radius:99px;background:#67e8a512}.notice{padding:12px;border:1px dashed #ffffff20;border-radius:13px;color:var(--m);line-height:1.5}.bottom{display:none}@media(max-width:800px){.side{display:none}.main{margin:0;padding:13px 11px 80px}.g2,.g3{grid-template-columns:1fr}.hero h2{font-size:27px}.orb{opacity:.4;right:-30px}.search{display:none}.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:10;bottom:0;left:0;right:0;background:#080a0fee;border-top:1px solid var(--l);padding:7px}.bottom button{background:none;border:0;color:var(--m);font-size:10px;padding:7px}.bottom button.active{color:var(--g)}} </style></head><body>
<aside class="side"><div class="brand">PRISM ORBIT<small>Prism of Stories · Agency OS</small></div><nav class="nav" id="nav"></nav><div class="notice" style="position:absolute;bottom:18px;left:14px;right:14px;font-size:11px">● System ready<br>Business data is separated by role.</div></aside>
<main class="main"><header class="top"><div><div class="ey">Prism of Stories</div><h1 id="title">Command Center</h1><div class="sub">Good afternoon, Amal sir.</div></div><div class="actions"><input class="field search" placeholder="Search…"><button class="btn">🔔</button><button class="btn ai" onclick="show('ai')">✦ AI</button></div></header><div id="pages"></div></main></div><nav class="bottom" id="bottom"></nav>
<script>
const items=[['home','⌂','Command Center'],['team','◉','Team'],['clients','◇','Clients'],['projects','▣','Projects'],['growth','↗','Growth'],['tasks','✓','Tasks'],['ai','✦','Prism AI'],['settings','⚙','Settings']];
const team=[['Amal','Partner','Business & Strategy'],['Adhil','Partner','Operations & Growth'],['Aneesh','Design','Creative & Branding'],['Satheesh','AI & Development','AI · Websites · Automation']];
function card(t,b){return '<div class="card"><b>'+t+'</b>'+b+'</div>'}
function home(){return '<div class="card hero"><div class="ey">Agency operating system</div><h2>Run Prism of Stories from one orbit.</h2><p>Manage clients, people, projects, growth, tasks and AI workflows from a focused business command center.</p><div class="command"><input id="cmd" class="field" placeholder="Try: find Dubai hotel prospects"><button class="btn ai" onclick="route()">Run</button></div><div class="orb"></div></div><div class="grid g3" style="margin-top:12px">'+card('Active clients','<div class="metric">2</div><div class="sub">Al Eliza + Nostaza</div>')+card('Team','<div class="metric">4</div><div class="sub">Partners & specialists</div>')+card('AI Lab','<div class="metric">Lunes AI</div><div class="sub">Business intelligence</div>')+'</div><div class="grid g2" style="margin-top:12px">'+card('Today','<div class="row"><span>Nostaza growth review</span><span class="tag">Priority</span></div><div class="row"><span>Hospitality prospecting</span><span class="tag">Growth</span></div><div class="row"><span>Assign design tasks</span><span class="tag">Team</span></div>')+card('AI recommendation','<div class="notice">Build a focused Dubai hospitality prospect list, personalize outreach, and create follow-up tasks. External sending requires authorized integrations and confirmation.</div><button class="btn primary" style="margin-top:12px" onclick="show(\'growth\')">Open Growth</button>')+'</div>'}
function teamPage(){return '<div class="grid g2">'+team.map(x=>card(x[0],'<div class="sub">'+x[1]+' · '+x[2]+'</div><div style="margin-top:14px"><button class="btn">Message</button> <button class="btn primary">Assign task</button></div>')).join('')+'</div>'}
function clients(){return '<div class="grid g2">'+card('Al Eliza Interiors','<div class="sub">Qatar / Dubai</div><p>Website · SEO · Digital growth</p><button class="btn primary">Open workspace</button>')+card('Nostaza Restaurant','<div class="sub">Al Warqa, Dubai</div><p>Social · Delivery · Growth</p><button class="btn primary">Open workspace</button>')+'</div><div class="notice" style="margin-top:12px">Hotels, restaurants and hospitality companies beyond these two are prospects, not current clients.</div>'}
function projects(){return '<div class="grid g2">'+['Nostaza Growth Engine','Al Eliza Lead Engine','Lunes AI','Prism Hospitality Outreach','Prism Content Engine','AI Reporting Copilot'].map((x,i)=>card(x,'<div class="sub">Owner: '+team[i%4][0]+'</div><div class="row"><span>Progress</span><span class="tag">'+(28+i*11)+'%</span></div><button class="btn" style="margin-top:10px">Open</button>')).join('')+'</div>'}
function growth(){return '<div class="card"><div class="ey">Business Growth</div><h2>Hospitality Prospecting</h2><p class="sub">Target Dubai hotels, restaurants, hospitality groups and related businesses.</p><div class="grid g3" style="margin-top:15px">'+['Dubai Hotels','Dubai Restaurants','Hospitality Groups'].map(x=>card(x,'<div class="notice" style="margin-top:10px">Prospect segment ready for research and enrichment when a data source is connected.</div><button class="btn primary" style="margin-top:10px">Research</button>')).join('')+'</div></div><div class="grid g2" style="margin-top:12px">'+card('CRM pipeline','<div class="row"><span>New Lead</span><span class="tag">0</span></div><div class="row"><span>Contacted</span><span class="tag">0</span></div><div class="row"><span>Meeting</span><span class="tag">0</span></div><div class="row"><span>Proposal</span><span class="tag">0</span></div>')+card('AI outreach','<div class="notice">Prepare personalized outreach. Sending is disabled until an authorized integration is connected.</div><button class="btn ai" style="margin-top:12px">Draft outreach</button>')+'</div>'}
function tasks(){return '<div class="card"><div style="display:flex;justify-content:space-between"><b>Agency Task Board</b><button class="btn primary">+ New task</button></div>'+['Review Nostaza campaign','Prepare Dubai hotel prospects','Aneesh — create restaurant reel','Satheesh — Lunes AI automation'].map((x,i)=>'<div class="row"><span>'+x+'<small class="sub" style="display:block">Due this week</small></span><span class="tag">'+(['High','Medium','Creative','Technical'][i])+'</span></div>').join('')+'</div>'}
function ai(){return '<div class="card hero"><div class="ey">Prism Intelligence</div><h2>Your business copilot.</h2><p>Use natural language to review clients, find prospects, draft outreach, plan campaigns and turn recommendations into tasks.</p><div class="grid g3" style="margin-top:18px">'+['Find hotel leads','Review clients','Write cold email','Plan meetings','Analyze growth','Create tasks'].map(x=>'<button class="btn" style="text-align:left;padding:15px">'+x+'<div class="sub">Open AI workflow</div></button>').join('')+'</div></div>'}
function settings(){return '<div class="grid g2">'+card('Integrations','<div class="row"><span>Supabase</span><span class="tag">Backend</span></div><div class="row"><span>Gmail</span><span class="tag">Authorization needed</span></div><div class="row"><span>Google Calendar</span><span class="tag">Authorization needed</span></div><div class="row"><span>Meta / Instagram</span><span class="tag">Authorization needed</span></div>')+card('Access model','<div class="notice"><b>Partners:</b> Amal + Adhil<br><b>Design:</b> Aneesh<br><b>AI & Development:</b> Satheesh<br><br>Client workspaces remain separated from private data.</div>')+'</div>'}
const pages={home:home,team:teamPage,clients:clients,projects:projects,growth:growth,tasks:tasks,ai:ai,settings:settings};
function show(k){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+k).classList.add('active');document.getElementById('title').textContent=items.find(x=>x[0]===k)[2];document.querySelectorAll('button[data-k]').forEach(x=>x.classList.toggle('active',x.dataset.k===k))}
function route(){let q=(document.getElementById('cmd').value||'').toLowerCase();show(q.includes('hotel')||q.includes('restaurant')||q.includes('lead')?'growth':q.includes('client')?'clients':q.includes('task')?'tasks':'ai')}
document.getElementById('nav').innerHTML=items.map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+' &nbsp; '+x[2]+'</button>').join('');
document.getElementById('bottom').innerHTML=items.slice(0,4).map(x=>'<button data-k="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'<br>'+x[2]+'</button>').join('');
document.getElementById('pages').innerHTML=Object.entries(pages).map(([k,f])=>'<section id="p-'+k+'" class="page">'+f()+'</section>').join('');show('home');
</script></body></html>
